apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlas-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/velrite/atlas.git
    targetRevision: main
    path: helm/atlas-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: atlas-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
