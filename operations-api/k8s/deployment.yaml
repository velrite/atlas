apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-api
  namespace: default
  labels:
    app: operations-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operations-api
  template:
    metadata:
      labels:
        app: operations-api
    spec:
      containers:
        - name: operations-api
          # NEVER :latest — Kyverno's disallow-latest-tag policy rejects
          # it outright. Replace COMMIT_SHA with the real 8-char SHA
          # before applying, same convention already used for Atlas's
          # own deploys (image tag = commit SHA in values.yaml).
          image: us-central1-docker.pkg.dev/velrite-tf-test/atlas/operations-api:COMMIT_SHA
          ports:
            - containerPort: 8080
          # require-resource-requests-limits is the third live Kyverno
          # policy — this pod gets admission-rejected without this block.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: operations-api
  namespace: default
spec:
  selector:
    app: operations-api
  ports:
    - port: 80
      targetPort: 8080
  # ClusterIP, same as every other Atlas service — deliberately NOT
  # exposed externally (ADR-016, and we just chose port-forward for
  # Phase 8/9 connectivity, not Ingress).
  type: ClusterIP
