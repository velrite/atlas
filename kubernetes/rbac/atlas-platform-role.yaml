apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-platform-role
  namespace: atlas-platform
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
