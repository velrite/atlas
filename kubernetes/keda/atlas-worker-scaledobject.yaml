apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-trigger-auth-gmp
  namespace: atlas-platform
spec:
  podIdentity:
    provider: gcp
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: atlas-worker-scaler
  namespace: atlas-platform
spec:
  scaleTargetRef:
    name: atlas-worker
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/velrite-tf-test/location/global/prometheus
        query: sum(rate(atlas_scheduler_jobs_requeued_total[2m]))
        threshold: "0.1"
        activationThreshold: "0.01"
      authenticationRef:
        name: keda-trigger-auth-gmp
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 50
              periodSeconds: 30
