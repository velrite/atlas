apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: atlas-worker-scaler
  namespace: atlas-platform
spec:
  scaleTargetRef:
    name: atlas-worker
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    - type: redis
      metadata:
        address: redis.atlas-platform.svc.cluster.local:6379
        listName: "atlas:queue:pending"
        listLength: "5"
        activationListLength: "1"
        databaseIndex: "0"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 50
              periodSeconds: 30
